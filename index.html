<style>

<script>
/* ================= DATOS ================= */
/* mc(nivel, enunciado, correcta, mala1, mala2, mala3) — cada opción es [texto, retroalimentación]. La 1.ª es la correcta; el motor mezcla el orden. */
function mc(l, q) {
  var a = Array.prototype.slice.call(arguments, 2);
  return { k: 'mc', l: l, q: q, o: a.map(function (x, i) { return { t: x[0], f: x[1], ok: i === 0 }; }) };
}
function nu(l, q, ans, tol, unit, h, sol) { return { k: 'num', l: l, q: q, ans: ans, tol: tol, unit: unit, h: h, sol: sol }; }
function dv(q, model, check) { return { k: 'dev', q: q, model: model, check: check }; }

var MODS = [];

/* ---------- GESTIÓN (Render cap. 3 y 7) ---------- */
MODS.push({
  id: 'gestion', short: 'Gestión', name: 'Gestión: Proyectos y Estrategia de Proceso', icon: '🏗️', color: '#ffb300',
  date: '2026-10-13', time: '7:00 am', simN: 24,
  source: 'Libro Render · Cap. 3 (Administración de proyectos, p. 55) y Cap. 7 (Estrategia de proceso, p. 255)',
  note: 'Los ejercicios numéricos usan datos propios con la misma mecánica que los del libro (3.3, 3.6, 3.7, 3.9a, 3.10, 3.12, 3.15a, 7.5, 7.6). Practica también los del libro con tus números reales.',
  worlds: [
    {
      id: 'g1', name: 'Fundamentos de la administración de proyectos', pp: 'Cap. 3 · pp. 55–62',
      review: [
        '<b>Proyecto:</b> conjunto de actividades únicas, con inicio y fin, para lograr un objetivo. Se administra en 3 fases: <b>planeación, programación y control</b>.',
        '<b>Planeación:</b> fijar objetivos, definir el proyecto, organizar el equipo y desglosar el trabajo (EDT).',
        '<b>Programación:</b> relacionar personas, dinero y materiales con actividades específicas, y las actividades entre sí (Gantt, PERT/CPM).',
        '<b>Control:</b> vigilar recursos, costos, calidad y presupuesto; comparar lo real con lo planeado y corregir.',
        '<b>EDT (estructura de desglose del trabajo):</b> divide el proyecto en niveles: 1 proyecto, 2 tareas principales, 3 subtareas, 4 paquetes de trabajo.',
        '<b>Gerente de proyecto:</b> coordina y responde por tiempo, costo y calidad; integra personas de varias áreas.'
      ],
      items: [
        mc(1, '¿Cuáles son las tres fases de la administración de proyectos?',
          ['Planeación, programación y control', 'Son las tres fases que describe el libro: planear qué hacer, programar cuándo y con qué, y controlar el avance.'],
          ['Diseño, producción y entrega', 'Son etapas de un producto, no de la administración del proyecto.'],
          ['Pronóstico, programación y control', 'El pronóstico es de planeación de la demanda; la primera fase aquí es la planeación del proyecto.'],
          ['Presupuesto, compra e inventario', 'Son funciones de apoyo; no son las fases de la administración de proyectos.']),
        mc(1, 'La EDT (estructura de desglose del trabajo) sirve para:',
          ['Dividir el proyecto en tareas, subtareas y paquetes de trabajo', 'Descompone el proyecto de lo general a lo específico para poder asignar y controlar.'],
          ['Calcular la probabilidad de terminar a tiempo', 'Eso se hace con PERT y la distribución normal, no con la EDT.'],
          ['Determinar el precio de venta del proyecto', 'La EDT organiza trabajo; no fija precios.'],
          ['Registrar las horas trabajadas por persona', 'Eso es parte del control; la EDT es una herramienta de planeación.']),
        mc(1, '¿Qué fase relaciona personas, dinero y materiales con actividades específicas y las actividades entre sí?',
          ['Programación', 'Programar es decidir cuándo y con qué recursos se hace cada actividad y en qué orden.'],
          ['Planeación', 'Planear fija objetivos y define el trabajo; la asignación en el tiempo es programación.'],
          ['Control', 'Controlar es vigilar y corregir lo que ya se programó.'],
          ['Cierre', 'No es una de las tres fases del enfoque de Render.']),
        mc(1, '¿Qué hace el gerente de proyecto?',
          ['Coordina el trabajo y responde por tiempo, costo y calidad', 'Integra al equipo y es responsable de que el proyecto cumpla alcance, plazo y presupuesto.'],
          ['Ejecuta personalmente todas las actividades', 'Coordina; no hace todo el trabajo técnico.'],
          ['Solo aprueba facturas', 'Su papel es mucho más amplio: planear, programar y controlar.'],
          ['Se encarga únicamente de comprar los materiales', 'Compras es una parte; el gerente responde por el proyecto completo.']),
        mc(2, '¿Cuál actividad corresponde a la fase de <b>control</b>?',
          ['Comparar el avance real con el plan y corregir desviaciones', 'Controlar es medir lo real contra lo planeado y actuar.'],
          ['Definir los objetivos del proyecto', 'Eso es planeación.'],
          ['Construir el diagrama de red con las precedencias', 'Eso es programación.'],
          ['Desglosar el proyecto en paquetes de trabajo', 'Eso es planeación (EDT).']),
        mc(2, 'Un equipo define objetivos, nombra responsables y descompone el trabajo en una EDT. ¿En qué fase está?',
          ['Planeación', 'Fijar objetivos, organizar y desglosar son tareas de planeación.'],
          ['Programación', 'La programación viene después: tiempos, recursos y secuencia.'],
          ['Control', 'Todavía no hay avance que medir.'],
          ['Mejora continua', 'No es una fase de administración de proyectos.']),
        mc(2, 'Ventaja principal de una gráfica de Gantt:',
          ['Muestra de forma visual el inicio y fin de cada actividad en el tiempo', 'Es simple y fácil de entender: barras contra un calendario.'],
          ['Calcula automáticamente la probabilidad de terminar', 'Eso lo hace PERT.'],
          ['Muestra con detalle todas las relaciones de precedencia', 'Es justamente su debilidad; para eso están las redes PERT/CPM.'],
          ['Optimiza el costo del proyecto', 'No optimiza costos; solo representa la programación.']),
        mc(3, 'En una remodelación, el costo excedió 30 % y nadie lo notó hasta el final. ¿Qué función falló y qué se debió hacer?',
          ['Control: comparar costo real contra presupuesto periódicamente y corregir', 'El problema fue la falta de monitoreo. Se debieron hacer revisiones frecuentes y ajustes.'],
          ['Planeación: habría que cancelar el proyecto', 'No se puede concluir eso; el fallo descrito es de seguimiento, no de objetivos.'],
          ['Programación: dibujar más flechas en la red', 'Un diagrama más detallado no detecta desviaciones de costo.'],
          ['Ninguna: los sobrecostos son normales', 'Sin control, los sobrecostos crecen sin que nadie reaccione.']),
        dv('Explique por qué es importante la administración de proyectos (dé al menos tres razones) y nombre las tres fases.',
          'Los proyectos tienen recursos limitados (tiempo, dinero, personas) y muchas actividades relacionadas; administrarlos permite cumplir plazos y presupuesto, coordinar áreas, detectar problemas a tiempo y lograr la calidad esperada. Las fases son planeación, programación y control.',
          ['Mencioné al menos 3 razones (plazo, costo, coordinación, calidad)', 'Nombré planeación, programación y control', 'Expliqué brevemente qué se hace en cada una'])
      ]
    },
    {
      id: 'g2', name: 'Redes, ruta crítica y holgura', pp: 'Cap. 3 · pp. 63–73 · Ej. 3.1–3.3, Fig. 3.11',
      review: [
        '<b>AON</b> (actividad en el nodo): las actividades son nodos y las flechas muestran precedencia. <b>AOA</b> (actividad en la flecha): las actividades son flechas y los nodos son eventos; usa <b>actividades ficticias</b> (duración 0) para respetar precedencias.',
        '<b>Pasada hacia adelante:</b> ES = mayor EF de las predecesoras · EF = ES + t.',
        '<b>Pasada hacia atrás:</b> LF = menor LS de las sucesoras · LS = LF − t. (Empieza con LF final = EF final del proyecto.)',
        '<b>Holgura</b> = LS − ES = LF − EF. <b>Ruta crítica</b> = ruta más larga, con holgura 0; fija la duración del proyecto.',
        'Un retraso en una actividad crítica retrasa el proyecto; en una no crítica solo si supera su holgura.'
      ],
      ex: '<br>Actividades: A(3) · B(2, sigue a A) · C(4, sigue a A) · D(5, sigue a B) · E(2, sigue a C) · F(3, sigue a D y E).' +
        '<div class="scroll"><table><tr><th>Act</th><th>t</th><th>ES</th><th>EF</th><th>LS</th><th>LF</th><th>Holg.</th></tr>' +
        '<tr><td>A</td><td>3</td><td>0</td><td>3</td><td>0</td><td>3</td><td>0</td></tr>' +
        '<tr><td>B</td><td>2</td><td>3</td><td>5</td><td>3</td><td>5</td><td>0</td></tr>' +
        '<tr><td>C</td><td>4</td><td>3</td><td>7</td><td>4</td><td>8</td><td>1</td></tr>' +
        '<tr><td>D</td><td>5</td><td>5</td><td>10</td><td>5</td><td>10</td><td>0</td></tr>' +
        '<tr><td>E</td><td>2</td><td>7</td><td>9</td><td>8</td><td>10</td><td>1</td></tr>' +
        '<tr><td>F</td><td>3</td><td>10</td><td>13</td><td>10</td><td>13</td><td>0</td></tr></table></div>' +
        'Ruta crítica A–B–D–F = 13. La otra ruta A–C–E–F = 12 (1 de holgura).',
      items: [
        mc(1, 'En una red AON (actividad en el nodo), las flechas representan:',
          ['Relaciones de precedencia entre actividades', 'Cada actividad es un nodo y la flecha dice cuál va antes de cuál.'],
          ['Las actividades con su duración', 'Eso es la red AOA (actividad en la flecha).'],
          ['Eventos o hitos del proyecto', 'Los eventos son los nodos en AOA.'],
          ['Los recursos asignados', 'Las flechas no muestran recursos.']),
        mc(1, 'La holgura de una actividad se calcula como:',
          ['LS − ES (o LF − EF)', 'Es cuánto se puede atrasar sin retrasar el proyecto.'],
          ['ES − LS', 'Daría el signo invertido (negativo).'],
          ['EF − ES', 'Eso es la duración de la actividad, no la holgura.'],
          ['LF + EF', 'No tiene significado como holgura.']),
        mc(1, 'La ruta crítica es:',
          ['La ruta más larga de la red; sus actividades tienen holgura 0', 'Su duración es el tiempo mínimo en que puede terminar el proyecto.'],
          ['La ruta más corta de la red', 'Si fuera la más corta, el proyecto terminaría antes de completar las demás rutas.'],
          ['La ruta con más actividades', 'Importa la duración, no la cantidad de actividades.'],
          ['La ruta de mayor costo', 'La crítica se define por tiempo, no por costo.']),
        mc(1, 'Si una actividad tiene varias predecesoras, su ES es:',
          ['El mayor de los EF de las predecesoras', 'Debe esperar a que termine la última predecesora.'],
          ['El menor de los EF de las predecesoras', 'Eso se usaría para el LF en la pasada hacia atrás (con LS).'],
          ['El promedio de los EF', 'No se promedia; manda la más tardía.'],
          ['La suma de los EF', 'No se suman; se toma el máximo.']),
        nu(2, 'Con la red del ejemplo (A3, B2, C4, D5, E2, F3; B y C siguen a A; D sigue a B; E a C; F a D y E), ¿cuál es la duración del proyecto en semanas?',
          13, 0.01, 'semanas', 'Suma cada ruta completa y toma la mayor: A–B–D–F y A–C–E–F.',
          'A–B–D–F = 3+2+5+3 = 13. A–C–E–F = 3+4+2+3 = 12. El proyecto dura la más larga: <b>13</b>.'),
        nu(2, 'En la misma red, ¿cuál es el ES de la actividad F?',
          10, 0.01, 'semanas', 'F espera a D y E. ¿Cuál termina más tarde: EF de D o EF de E?',
          'EF(D) = 5+5 = 10; EF(E) = 7+2 = 9. ES(F) = máx(10, 9) = <b>10</b>.'),
        nu(2, 'En la misma red, ¿cuál es la holgura de la actividad C?',
          1, 0.01, 'semanas', 'Compara la longitud de la ruta que contiene a C con la de la ruta crítica.',
          'Ruta de C = 12; ruta crítica = 13. Holgura = 13 − 12 = <b>1</b> (LS 4 − ES 3 = 1).'),
        mc(2, 'En la misma red, ¿cuál es la ruta crítica?',
          ['A–B–D–F', 'Suma 13, la mayor; todas sus actividades tienen holgura 0.'],
          ['A–C–E–F', 'Suma 12; tiene 1 semana de holgura, no es crítica.'],
          ['A–B–D–E–F', 'D no precede a E en esta red; esa ruta no existe.'],
          ['C–E', 'Una ruta crítica va de inicio a fin de la red, no son dos actividades sueltas.']),
        nu(3, 'Si la actividad C (holgura 1) se retrasa 3 semanas, ¿cuántas semanas se retrasa el <b>proyecto</b>?',
          2, 0.01, 'semanas', 'Solo cuenta el retraso que excede la holgura.',
          'Retraso 3 − holgura 1 = <b>2</b>. La ruta A–C–E–F pasa a 12+3 = 15, contra 13 de la crítica original.'),
        mc(3, 'Si la actividad D (crítica) se retrasa 2 semanas, el proyecto:',
          ['Se retrasa 2 semanas', 'D tiene holgura 0: todo su retraso se traslada al final.'],
          ['No se retrasa, porque hay otra ruta', 'La otra ruta es más corta; no absorbe el retraso de la crítica.'],
          ['Se retrasa 1 semana', 'La holgura 1 es de C y E, no de D.'],
          ['Depende del costo de D', 'El retraso en tiempo no depende del costo.']),
        mc(2, '¿Para qué sirve una actividad ficticia (dummy) en una red AOA?',
          ['Representar una precedencia sin consumir tiempo ni recursos', 'Mantiene la lógica de la red y evita actividades con el mismo par de eventos.'],
          ['Aumentar la duración del proyecto', 'Su duración es cero.'],
          ['Registrar una actividad opcional del cliente', 'No es una actividad real.'],
          ['Marcar la ruta crítica', 'No tiene relación con identificar la ruta crítica.']),
        mc(2, 'En la pasada hacia atrás, si una actividad tiene dos sucesoras con LS de 8 y 11, su LF es:',
          ['8', 'LF es el menor de los LS de las sucesoras: no puede terminar después de que deba empezar la primera.'],
          ['11', 'Tomar el mayor permitiría atrasar la sucesora de LS 8.'],
          ['9,5', 'No se promedia.'],
          ['19', 'No se suman.']),
        mc(3, '¿Puede un proyecto tener más de una ruta crítica?',
          ['Sí, cuando dos o más rutas empatan en la mayor duración', 'Todas tendrán holgura 0 y cualquier retraso en ellas retrasa el proyecto.'],
          ['No, siempre existe una sola', 'Pueden empatar varias rutas.'],
          ['Sí, pero solo en redes AOA', 'Ocurre igual en AON y AOA.'],
          ['No, si hay actividades ficticias', 'Las ficticias no impiden empates.'])
      ]
    },
    {
      id: 'g3', name: 'PERT: tres estimaciones y probabilidad', pp: 'Cap. 3 · pp. 73–79 · Ej. 3.3, 3.6, 3.7, 3.9a',
      review: [
        'PERT usa tres estimaciones: <b>optimista (a)</b>, <b>más probable (m)</b> y <b>pesimista (b)</b>, con distribución beta.',
        '<b>Tiempo esperado:</b> te = (a + 4m + b) / 6',
        '<b>Varianza:</b> σ² = ((b − a) / 6)²',
        'Varianza de la ruta crítica = <b>suma de las varianzas de sus actividades críticas</b>; σ = √(suma).',
        '<b>Z</b> = (fecha deseada − duración esperada de la ruta crítica) / σ. Luego se busca el área en la tabla normal.',
        'Z = 0 → 50 % · Z = 1 → ≈ 84 % · Z = 2 → ≈ 97,7 % · Z = −1 → ≈ 16 %.'
      ],
      ex: '<br>Actividad con a=2, m=5, b=14: te = (2+20+14)/6 = 6; σ² = (12/6)² = 4.<br>Ruta crítica esperada 40 semanas, σ² total 16 → σ = 4. Probabilidad de terminar en 44: Z = (44−40)/4 = 1 → <b>84,13 %</b>.',
      items: [
        mc(1, 'Las tres estimaciones de PERT son:',
          ['Optimista, más probable y pesimista', 'Con ellas se calcula el tiempo esperado y la variabilidad.'],
          ['Mínima, media y máxima de costo', 'PERT estima tiempos, no costos.'],
          ['Normal, acelerada y de emergencia', 'Esos son tiempos de CPM (normal y de aceleración).'],
          ['Temprana, tardía y de holgura', 'Son valores del cálculo de la red (ES/LS), no estimaciones.']),
        mc(1, 'La fórmula del tiempo esperado en PERT es:',
          ['(a + 4m + b) / 6', 'Da más peso a la estimación más probable.'],
          ['(a + m + b) / 3', 'Es un promedio simple; PERT pondera m con 4.'],
          ['(a + b) / 2', 'Ignora la estimación más probable.'],
          ['(b − a) / 6', 'Eso es la desviación estándar de la actividad.']),
        nu(2, 'Calcule el tiempo esperado de una actividad con a = 2, m = 5 y b = 14 días.',

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function scored(w) { return w.items.filter(function (x) { return x.k !== 'dev'; }); }
function modItems(m) { var r = []; m.worlds.forEach(function (w) { r = r.concat(scored(w)); }); return r; }

MODS.forEach(function (m) {
  m.worlds.forEach(function (w, wi) {
    w.n = wi + 1;
    w.items.forEach(function (it, i) { it.id = m.id + '.' + w.id + '.' + i; it.mod = m; it.world = w; });
  });
});

function daysTo(m) {
  var a = new Date(); a.setHours(0, 0, 0, 0);
  var p = m.date.split('-');
  var b = new Date(+p[0], +p[1] - 1, +p[2]);
  return Math.round((b - a) / 864e5);
}
function cd(m) {
  var d = daysTo(m);
  if (d < 0) return 'Ya pasó';
  if (d === 0) return '¡Es hoy!';
  if (d === 1) return 'Mañana';
  return 'En ' + d + ' días';
}
function fdate(m) {
  var p = m.date.split('-'); var mes = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'set', 'oct', 'nov', 'dic'];
  return +p[2] + ' ' + mes[+p[1] - 1] + ' · ' + m.time;
}
function prog(m, ws) {
  var items = ws ? scored(ws) : modItems(m), st = ms(m.id), a = 0, c = 0;
  items.forEach(function (it) { if (st.f[it.id] !== undefined) { a++; if (st.f[it.id] === 1) c++; } });
  return { a: a, c: c, t: items.length };
}
function announce(t) { $live.textContent = ''; setTimeout(function () { $live.textContent = t; }, 30); }
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

function bar(p, color) {

}

    h += '<label class="mut" for="ans">Tu respuesta' + (it.unit ? ' (' + esc(it.unit) + ')' : '') + ':</label>' +
      '<input id="ans" type="text" inputmode="decimal" autocomplete="off" value="' + esc(P.val || '') + '"' + (P.solved || P.sol ? ' disabled' : '') + '>';
    if (!sim2 && P.msg) h += '<div class="fb ' + (P.solved ? 'good' : 'bad') + '" style="border-radius:12px;margin-top:10px">' + P.msg + '</div>';
    if (!sim2 && (P.solved || P.sol)) h += '<div class="box ex"><b>Solución paso a paso</b><br>' + it.sol + '</div>';
    if (sim2) bot = '<button class="pri" style="--c:' + c + '" data-act="confirm">Confirmar y seguir</button>';
    else if (P.solved || P.sol) bot = nextBtn(c);
    else {
      bot = '<button class="pri" style="--c:' + c + '" data-act="check">Comprobar</button>';
      if (P.tries >= 2) bot += '<button class="sec" data-act="showsol" style="width:auto;flex:none">Ver solución</button>';
    }
  } else { // dev
    h += '<div class="box">Ítem de <b>desarrollo</b>: no puntúa. Escribe tu respuesta en papel o mentalmente y luego compárala.</div>';
    if (!P.sol) bot = '<button class="pri" style="--c:' + c + '" data-act="showdev">Mostrar respuesta modelo</button>';
    else {
      h += '<div class="box ex"><b>Respuesta modelo</b><br>' + it.model + '</div><h3>Lista de cotejo</h3>';
      it.check.forEach(function (x) { h += '<label class="ck"><input type="checkbox"><span>' + x + '</span></label>'; });
      bot = nextBtn(c);
    }
  }
  h += '<div class="bottom"><div>' + bot + '</div></div>';
  return h;
}
function nextBtn(c) { return '<button class="pri" style="--c:' + c + '" data-act="next">' + (P.i + 1 >= P.q.length ? 'Terminar' : 'Siguiente →') + '</button>'; }

function parseNum(s) {
  s = String(s).trim().replace(/\s/g, '').replace(/[%$₡]/g, '');
  var f = s.match(/^(-?\d+(?:[.,]\d+)?)\/(\d+(?:[.,]\d+)?)$/);
  if (f) return parseFloat(f[1].replace(',', '.')) / parseFloat(f[2].replace(',', '.'));
  if (/^-?\d{1,3}([.,]\d{3})+$/.test(s)) s = s.replace(/[.,]/g, '');
  s = s.replace(',', '.');
  return /^-?\d*\.?\d+$/.test(s) ? parseFloat(s) : NaN;
}

function record(it, ok) {
  if (P.mode === 'world') {
    var st = ms(it.mod.id);
    if (st.f[it.id] === undefined) { st.f[it.id] = ok ? 1 : 0; save(); }
  }
  if (P.mode !== 'redo' && P.mode !== 'sim' && !P.rec[it.id]) { P.rec[it.id] = 1; P.firstN++; if (ok) P.firstOk++; }
}

function finish() {
  if (P.mode === 'sim') {
    var ok = P.ans.filter(function (a) { return a.ok; }).length, n = P.q.length, pct = Math.round(ok / n * 100);
    var st = ms(P.mod.id);
    st.sim = { last: pct, best: Math.max(pct, st.sim ? st.sim.best : 0), date: new Date().toISOString().slice(0, 10) };
    save();
    go('res', { kind: 'sim', ok: ok, n: n, pct: pct, secs: Math.round((Date.now() - P.t0) / 1000), ans: P.ans, q: P.q, mod: P.mod });
  } else if (P.mode === 'redo') {
    go('res', { kind: 'redo', mod: P.mod, back: P.back });
  } else {
    go('res', { kind: 'world', mod: P.mod, world: P.world, ok: P.firstOk, n: P.firstN, nt: scored(P.world).length });
  }
}

function vRes() {
  var m = V.mod, c = m.color, h = '';
  if (V.kind === 'world') {
    h = '<h1 id="h" tabindex="-1">Mundo completado 🎉</h1><div class="card"><p class="mut">' + esc(V.world.name) + '</p>' +
      '<p class="big">' + V.ok + ' / ' + V.n + '</p><p>aciertos a la primera' + (V.n < V.nt ? ' (de los que contestaste esta vez)' : '') + '.</p>' +
      '<p class="mut">' + (V.n && V.ok / V.n >= 0.8 ? 'Dominado. Pasa al siguiente mundo.' : 'Vuelve a leer el repaso y repite el mundo: lo que fallas hoy es lo que pierdes en el examen.') + '</p></div>' +
      '<div class="bottom"><div><button class="sec" data-act="world" data-id="' + V.world.id + '">Repetir</button><button class="pri" style="--c:' + c + '" data-act="mod" data-id="' + m.id + '">Volver a mundos</button></div></div>';
  } else if (V.kind === 'redo') {
    h = '<h1 id="h" tabindex="-1">Repaso terminado ✅</h1><div class="card"><p>Ya corregiste cada ítem que fallaste en el simulacro. Haz otro simulacro para medirte.</p></div>' +
      '<div class="bottom"><div><button class="pri" style="--c:' + c + '" data-act="mod" data-id="' + m.id + '">Volver</button></div></div>';
  } else {
    var mm = Math.floor(V.secs / 60), ss = ('0' + (V.secs % 60)).slice(-2), by = {}, bad = [];
    V.q.forEach(function (it, i) { var k = it.world.n + '. ' + it.world.name; by[k] = by[k] || [0, 0]; by[k][1]++; if (V.ans[i].ok) by[k][0]++; else bad.push(i); });
    h = '<h1 id="h" tabindex="-1">Resultado del simulacro</h1><div class="card"><p class="big ' + (V.pct >= 70 ? 'ok' : 'no') + '">' + V.pct + '%</p><p>' + V.ok + ' de ' + V.n + ' correctas · tiempo ' + mm + ':' + ss + '</p>' +
      '<p class="mut">' + (V.pct >= 90 ? 'Excelente: estás listo.' : V.pct >= 70 ? 'Bien. Repasa lo que fallaste y repite.' : 'Falta repaso. Vuelve a los mundos con peor desglose.') + '</p></div>' +
      '<h3>Desglose por tema</h3><div class="card scroll"><table><tr><th>Mundo</th><th>Aciertos</th></tr>';
    Object.keys(by).forEach(function (k) { h += '<tr><td style="text-align:left">' + esc(k) + '</td><td>' + by[k][0] + '/' + by[k][1] + ' ' + (by[k][0] === by[k][1] ? '✅' : '⚠️') + '</td></tr>'; });
    h += '</table></div>';
    if (bad.length) {
      h += '<h3>Lo que fallaste</h3>';
      bad.forEach(function (i) {
        var it = V.q[i], a = V.ans[i];
        h += '<div class="card"><p class="q">' + it.q + '</p>';
        if (it.k === 'mc') {
          var okO = it.o.filter(function (o) { return o.ok; })[0];
          h += '<p class="no">❌ Tu respuesta: ' + (a.t || '(sin responder)') + '</p><p class="mut">' + (a.f || '') + '</p><p class="ok">✅ Correcta: ' + okO.t + '</p><p class="mut">' + okO.f + '</p>';
        } else {
          h += '<p class="no">❌ Tu respuesta: ' + esc(a.t || '(vacía)') + '</p><p class="ok">✅ Correcta: ' + it.ans + (it.unit ? ' ' + esc(it.unit) : '') + '</p><div class="box ex">' + it.sol + '</div>';
        }
        h += '</div>';
      });
    }
    h += '<div class="bottom"><div>' + (bad.length ? '<button class="sec" data-act="redo">Repasar lo que fallé</button>' : '') +
      '<button class="pri" style="--c:' + c + '" data-act="mod" data-id="' + m.id + '">Volver</button></div></div>';
  }
  announce('Resultados listos');
  return h;
}

function startTimer() {
  stopTimer();
  var el = document.getElementById('tm');
  function tick() { var e = document.getElementById('tm'); if (!e) return; var s = Math.round((Date.now() - P.t0) / 1000); e.textContent = ('0' + Math.floor(s / 60)).slice(-2) + ':' + ('0' + s % 60).slice(-2); }
  tick(); timer = setInterval(tick, 1000);
}

function modById(id) { return MODS.filter(function (m) { return m.id === id; })[0]; }

function pickSim(m) {
  var pools = m.worlds.map(function (w) { return shuffle(scored(w)); }), out = [], n = Math.min(m.simN, modItems(m).length), k = 0;
  while (out.length < n) {
    var p = pools[k % pools.length]; if (p.length) out.push(p.pop());
    k++; if (k > 5000) break;
  }
  return shuffle(out);
}

/* ---------- eventos ---------- */
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  var a = b.getAttribute('data-act'), id = b.getAttribute('data-id');
  if (a === 'home') return go('home');
  if (a === 'mod') return go('mod', { mod: modById(id) });
  if (a === 'world') { var m = V.mod || P.mod; var w = m.worlds.filter(function (x) { return x.id === id; })[0]; return go('review', { mod: m, world: w }); }
  if (a === 'start') { shuf = {}; return startQueue(V.world.items.slice(), 'world', 'Mundo ' + V.world.n, null, { mod: V.mod, world: V.world, rec: {} }); }
  if (a === 'sim') { shuf = {}; return startQueue(pickSim(V.mod), 'sim', 'Simulacro', null, { mod: V.mod }); }
  if (a === 'redo') {
    var q = V.q.filter(function (it, i) { return !V.ans[i].ok; }); shuf = {};
    return startQueue(q, 'redo', 'Repaso', null, { mod: V.mod, back: V.mod, rec: {} });
  }
  if (a === 'reset') { if (confirm('¿Borrar todo tu progreso y puntajes?')) { S = { m: {} }; save(); go('home'); } return; }
  if (a === 'quit') { if (P && P.mode === 'sim' && !confirm('¿Salir del simulacro? Se pierde el intento.')) return; return go('mod', { mod: P.mod }); }
  if (!P) return;
  var it = cur();
  if (a === 'pick') {
    var i = +b.getAttribute('data-i'), o = opts(it)[i];
    if (P.mode === 'sim') { P.sel = i; return render(); }
    P.tried = P.tried || {}; P.tried[i] = 1;
    if (!P.tries) record(it, o.ok);
    P.tries++;
    if (o.ok) P.solved = true;
    render(); announce(o.ok ? 'Correcto' : 'Incorrecto');
    var f = document.querySelector('.fb:last-of-type'); if (f && f.scrollIntoView) f.scrollIntoView({ block: 'nearest' });
    return;
  }
  if (a === 'check') {
    var inp = document.getElementById('ans'), v = parseNum(inp.value); P.val = inp.value;
    if (isNaN(v)) { P.msg = 'Escribe un número (puedes usar coma o punto decimal).'; return render(); }
    var ok = Math.abs(v - it.ans) <= it.tol;
    if (!P.tries) record(it, ok);
    P.tries++;
    if (ok) { P.solved = true; P.msg = '<b>Correcto.</b> ' + it.ans + (it.unit ? ' ' + esc(it.unit) : ''); }
    else P.msg = '<b>No coincide.</b> Pista: ' + it.h;
    render(); announce(ok ? 'Correcto' : 'Incorrecto');
    return;
  }
  if (a === 'showsol') { P.sol = true; P.msg = ''; return render(); }
  if (a === 'showdev') { P.sol = true; return render(); }
  if (a === 'confirm') {
    var ans;
    if (it.k === 'mc') { var oo = opts(it)[P.sel]; ans = { ok: oo.ok, t: oo.t, f: oo.ok ? '' : oo.f }; }
    else { var vv = parseNum(document.getElementById('ans').value); ans = { ok: !isNaN(vv) && Math.abs(vv - it.ans) <= it.tol, t: document.getElementById('ans').value }; }
    P.ans.push(ans);
    return advance();
  }
  if (a === 'next') return advance();
});

function advance() {
  if (P.i + 1 >= P.q.length) return finish();
  P.i++; P.tries = 0; P.solved = false; P.sel = null; P.sol = false; P.tried = null; P.msg = ''; P.val = '';
  render(); window.scrollTo(0, 0);
  var h = document.getElementById('h'); if (h) h.focus();
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'ans') {
    e.preventDefault();
    var b = document.querySelector('[data-act="check"],[data-act="confirm"],[data-act="next"]'); if (b) b.click();
    return;
  }
  if (V.v === 'play' && P && cur().k === 'mc' && /^[1-4]$/.test(e.key) && e.target.tagName !== 'INPUT') {
    var bs = document.querySelectorAll('[data-act="pick"]'); var x = bs[+e.key - 1]; if (x) x.click();
  }
});

load();
render();

</script>
